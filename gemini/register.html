<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaconAlgo - Créer un Compte</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥓</text></svg>">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --secondary: #F7931E;
            --dark: #0a0a0a;
            --darker: #000000;
            --card-bg: #151515;
            --border: #222222;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --success: #00D9FF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVIGATION ===== */
        nav {
            background: var(--dark);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 2000;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .logo:hover {
            transform: translateY(-2px);
        }

        .logo-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 10px rgba(255, 107, 53, 0.5));
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .logo-title {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-back {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-back:hover {
            color: var(--text);
            background: rgba(255, 107, 53, 0.1);
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
        }

        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 20px 60px rgba(255, 107, 53, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-big {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .title {
            font-size: 2em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
        }

        .password-strength {
            display: none;
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .password-strength.weak {
            display: block;
            background: rgba(248, 81, 73, 0.2);
            color: #ff6b9d;
            border: 1px solid rgba(248, 81, 73, 0.3);
        }

        .password-strength.medium {
            display: block;
            background: rgba(255, 159, 64, 0.2);
            color: #ffb366;
            border: 1px solid rgba(255, 159, 64, 0.3);
        }

        .password-strength.strong {
            display: block;
            background: rgba(0, 217, 255, 0.2);
            color: var(--success);
            border: 1px solid rgba(0, 217, 255, 0.3);
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 0.9em;
        }

        .terms-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .terms-checkbox label {
            margin: 0;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .terms-checkbox a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 600;
        }

        .terms-checkbox a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: var(--secondary);
        }

        .error {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: #ff6b9d;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: none;
            font-size: 0.9em;
            font-weight: 500;
        }

        .success {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            color: var(--success);
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: none;
            font-size: 0.9em;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 30px;
            }

            .title {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <div class="logo-icon">🥓</div>
                <div class="logo-text">
                    <div class="logo-title">BaconAlgo</div>
                    <div class="logo-subtitle">Trading Platform</div>
                </div>
            </a>

            <a href="index.html" class="nav-back">
                <span>←</span>
                <span>Retour à l'accueil</span>
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-big">🥓</div>
                <h1 class="title">Créer un Compte</h1>
                <p class="subtitle">Rejoins la Station BaconAlgo</p>
            </div>

            <div class="error" id="error-msg"></div>
            <div class="success" id="success-msg"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="fullname">Nom Complet</label>
                    <input 
                        type="text" 
                        id="fullname" 
                        name="fullname" 
                        placeholder="Jean Dupont" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="jean@example.com" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="bacontrader" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                        onkeyup="checkPasswordStrength(this.value)"
                    >
                    <div id="strengthBar" class="password-strength">
                        Faible - Minimum 8 caractères
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmer le mot de passe</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        name="confirm-password" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a>
                    </label>
                </div>

                <button type="submit" class="btn-register" id="submitBtn">
                    Créer mon Compte
                </button>
            </form>

            <p class="login-link">
                Déjà un compte? <a href="login.html">Se connecter</a>
            </p>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
    const sb = supabase.createClient(supabaseUrl, SUPABASE_KEY);

    async function handleRegister(event) {
        if(event) event.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const fullname = document.getElementById('fullname').value;
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.disabled = true;
        submitBtn.textContent = '⏳ Création...';

        const { data, error } = await sb.auth.signUp({
            email,
            password,
            options: { data: { full_name: fullname } }
        });

        if (error) {
            alert('Erreur: ' + error.message);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Créer mon Compte';
        } else {
            document.getElementById('success-msg').style.display = 'block';
            document.getElementById('success-msg').textContent = '✅ Succès ! Vérifie tes courriels pour confirmer.';
            setTimeout(() => { window.location.href = 'login.html'; }, 3000);
        }
    }
</script>
</body>
</html>
