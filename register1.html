<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaconAlgo - Inscription</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥓</text></svg>">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #FF6B35;
            --secondary: #F7931E;
            --dark: #0a0a0a;
            --card-bg: #151515;
            --border: #222222;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --success: #00D9FF;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container { padding: 20px; width: 100%; display: flex; justify-content: center; }

        .card {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .logo-big { font-size: 3em; margin-bottom: 10px; }
        .title { 
            font-size: 1.8em; 
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text); font-weight: 600; font-size: 0.9em; }
        .form-group input {
            width: 100%; padding: 12px 16px; background: var(--dark);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); font-size: 1em;
        }

        .btn-register {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; border: none; border-radius: 10px;
            font-weight: 700; font-size: 1em; cursor: pointer;
            margin-top: 10px; transition: transform 0.2s;
        }
        .btn-register:hover { transform: translateY(-2px); }
        .btn-register:disabled { opacity: 0.5; cursor: not-allowed; }

        .login-link { text-align: center; margin-top: 20px; font-size: 0.9em; color: var(--text-secondary); }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: 700; }

        .error {
            background: rgba(248, 81, 73, 0.1); border: 1px solid rgba(248, 81, 73, 0.3);
            color: #ff6b9d; padding: 12px; border-radius: 8px; margin-bottom: 20px;
            display: none; font-size: 0.9em;
        }
        .success {
            background: rgba(0, 217, 255, 0.1); border: 1px solid rgba(0, 217, 255, 0.3);
            color: var(--success); padding: 12px; border-radius: 8px; margin-bottom: 20px;
            display: none; font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-big">🥓</div>
                <h1 class="title">Créer un compte</h1>
                <p style="color: #666; font-size: 0.9em;">Rejoins l'élite du BaconAlgo</p>
            </div>

            <div class="error" id="error-msg"></div>
            <div class="success" id="success-msg"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="email@exemple.com">
                </div>

                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" required placeholder="Minimum 6 caractères">
                </div>

                <div class="form-group">
                    <label>Confirmer le mot de passe</label>
                    <input type="password" id="confirm-password" required placeholder="Répéter le mot de passe">
                </div>

                <button type="submit" class="btn-register" id="submitBtn">S'inscrire</button>
            </form>

            <p class="login-link">
                Déjà un compte? <a href="login.html">Se connecter</a>
            </p>
        </div>
    </div>

    <!-- SCRIPT BLINDÉ COMME LOGIN.HTML -->
<script>
  // ⬇️ AJOUTE CES 2 LIGNES AU TOP
  const SUPABASE_URL = "https://6bpsftbaklpxnytvtbfk.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // Copie ta clé publique
</script>

<!-- ⬇️ ENSUITE charge Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ⬇️ UTILISE les constantes
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // 3. Gestion Inscription
        var form = document.getElementById('registerForm');
        var newForm = form.cloneNode(true); // Reset listeners
        form.parentNode.replaceChild(newForm, form);

        newForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm-password').value;
            var btn = document.getElementById('submitBtn');
            var errDiv = document.getElementById('error-msg');
            var succDiv = document.getElementById('success-msg');

            errDiv.style.display = 'none';
            succDiv.style.display = 'none';

            if (password !== confirm) {
                errDiv.textContent = '❌ Les mots de passe ne correspondent pas.';
                errDiv.style.display = 'block';
                return;
            }

            if (password.length < 6) {
                errDiv.textContent = '❌ Le mot de passe doit faire au moins 6 caractères.';
                errDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Création en cours...';

            try {
                // Création du compte
                var { data, error } = await window.supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                succDiv.textContent = '✅ Compte créé avec succès! Redirection vers la connexion...';
                succDiv.style.display = 'block';

                // Si Supabase demande une confirm email, le message peut changer, 
                // mais souvent pour dev c'est auto-confirm.
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (err) {
                console.error(err);
                errDiv.textContent = '❌ Erreur: ' + (err.message || 'Impossible de créer le compte');
                errDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = "S'inscrire";
            }
        });
      }
    </script>
</body>
</html>
