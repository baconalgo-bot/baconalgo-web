<head>

<title>BaconAlgo LIVE 🥓</title>

<style>
body {
  margin:0;
  background:#0a0a0a;
  color:white;
  font-family: Inter, Arial, sans-serif;
}

.section {
  max-width:1400px;
  margin:auto;
  padding:40px 20px;
}

h1 {
  text-align:center;
  color:#ff6b35;
  margin-bottom:10px;
}

.countdown {
  text-align:center;
  font-size:22px;
  margin-bottom:30px;
  color:#ffd166;
}

.video-wrapper {
  aspect-ratio:16/9;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 0 45px rgba(255,107,53,0.4);
}

.grid {
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  margin-top:30px;
}

@media(max-width:900px){
  .grid { grid-template-columns:1fr; }
}

.button-donate {
  display:block;
  text-align:center;
  margin:25px auto;
  background:linear-gradient(135deg,#ff6b35,#ff8c42);
  color:white;
  padding:16px 30px;
  font-size:20px;
  font-weight:700;
  border-radius:999px;
  text-decoration:none;
  width:fit-content;
  box-shadow:0 0 25px rgba(255,107,53,0.7);
}

.label {
  text-align:center;
  margin-top:20px;
  opacity:0.8;
}
</style>
</head>

<body>

<!-- HEADER DE TON SITE ICI -->

<div class="section">

<h1>🔴 LIVE 4K — BaconAlgo</h1>

<div class="countdown" id="countdown">
⏳ Marché ouvre à 9h30 NY
</div>

<div class="grid">

<!-- VIDEO -->
<div class="video-wrapper">
<iframe
  src="https://www.youtube.com/embed/wTF7Ofn1BoE?autoplay=1&mute=1"
  width="100%" height="100%"
  frameborder="0"
  allow="autoplay; encrypted-media"
  allowfullscreen>
</iframe>
</div>

<!-- CHAT -->
<div class="video-wrapper">
<iframe
  src="https://www.youtube.com/live_chat?v=wTF7Ofn1BoE&embed_domain=baconalgo.com"
  width="100%" height="100%"
  frameborder="0">
</iframe>
</div>

</div>

<a class="button-donate"
   href="https://buy.stripe.com/cNi3cvaGm0RMerparx5wI00"
   target="_blank">
🥓 Soutenir BaconAlgo (Café & Rockets 🚀)
</a>

<div class="label">
www.baconalgo.com • Rockets 🚀 Stocks 📊 Futures ⚡ Crypto 🔥
</div>

</div>

<!-- FOOTER DE TON SITE ICI -->

<script>
// COUNTDOWN 9h30 NEW YORK
function updateCountdown(){
  const now = new Date();
  const nyTime = new Date(now.toLocaleString("en-US", {timeZone: "America/New_York"}));
  let target = new Date(nyTime);
  target.setHours(9,30,0,0);
  if(nyTime > target) target.setDate(target.getDate()+1);

  const diff = target - nyTime;
  const h = Math.floor(diff/1000/60/60);
  const m = Math.floor(diff/1000/60)%60;
  const s = Math.floor(diff/1000)%60;

  document.getElementById("countdown").innerText =
    `⏳ Marché ouvre dans ${h}h ${m}m ${s}s`;
}
setInterval(updateCountdown,1000);
updateCountdown();
</script>

</body>
