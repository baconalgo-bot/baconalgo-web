<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥓 BaconAlgo - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥓</text></svg>">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #151515;
            padding: 50px;
            border-radius: 12px;
            border: 1px solid #222;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .logo-icon { font-size: 2.5rem; }
        .logo-title {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FF6B35, #F7931E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0a0a0a;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #FF6B35;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FF6B35, #F7931E);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid #f85149;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .success-message {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid #00d9ff;
            color: #00d9ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .link a {
            color: #FF6B35;
            text-decoration: none;
            font-weight: 600;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- LOGO -->
        <div class="logo">
            <div class="logo-icon">🥓</div>
            <div class="logo-title">BaconAlgo</div>
        </div>

        <!-- MESSAGES -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="germain85@hotmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn">Connexion 🔓</button>

            <div class="loading" id="loading">Vérification en cours...</div>
        </form>

        <!-- LINK TO REGISTER -->
        <div class="link">
            Pas de compte? <a href="javascript:void(0)" onclick="alert('Les inscriptions sont fermées. Contactez admin@baconalgo.com')">S\'inscrire</a>
        </div>
    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script>
        const SUPABASE_URL = 'https://baconalgo-web.vercel.app';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ6ZXdzeXllbmptY3plaHdrYWZnIiwiYWxkIjoiYXNzb2NpYXRlZCIsInNlc3Npb25faWQiOiI3YzI2MzMzYS0zMWM5LTRkNDAtYmIzMS1kYTQxNGI1OTZhMzYifQ.nOINYkm0OggaBROGMzVlKhJxwE_xc0Tq3wCQ6FDn6pE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Réinitialise les messages
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';

            try {
                // 1️⃣ ESSAIE DE SE CONNECTER
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    console.error('❌ Login error:', error.message);
                    showError('Email ou mot de passe incorrect');
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('loading').style.display = 'none';
                    return;
                }

                // 2️⃣ VÉRIFIE QUE L'USER EXISTE DANS LA TABLE users (LA VRAIE PROTECTION!)
                const { data: userInDb, error: dbError } = await supabase
                    .from('users')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (dbError || !userInDb) {
                    // ⛔️ USER DANS AUTH MAIS PAS DANS LA TABLE users
                    console.error('❌ User not in database');
                    
                    // DELETE le compte fake de Supabase Auth
                    await supabase.auth.signOut();
                    
                    showError('Compte non autorisé. Contactez l\'administrateur.');
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('loading').style.display = 'none';
                    return;
                }

                // ✅ AUTHENTIFIÉ ET AUTORISÉ - REDIRIGE
                showSuccess('Connexion réussie! Redirection...');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (err) {
                console.error('❌ Erreur serveur:', err);
                showError('Erreur serveur. Réessayez plus tard.');
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        });

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMessage');
            el.innerText = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
